<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Επεξεργασία Γέφυρας</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .btn-row {
      margin-bottom: 2rem; /* pushes buttons higher up */
    }
  </style>
</head>
<body>
  <div class="container mt-4">
    <h3>Επεξεργασία Γέφυρας: {{ bridge['Όνομα'] }}</h3>
    <form method="post">
      {% for field in fields %}
        <div class="mb-3">
          <label class="form-label">{{ field }}</label>
          <input type="text" name="{{ field }}" value="{{ bridge[field] or '' }}" class="form-control">
        </div>
      {% endfor %}
      <div class="btn-row">
        <button type="submit" class="btn btn-primary">Αποθήκευση</button>
        <a href="{{ url_for('bridge_details', bridge_id=bridge['id']) }}" class="btn btn-secondary">Άκυρο</a>
      </div>
    </form>
  </div>
</body>
</html>
